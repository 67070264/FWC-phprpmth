<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            height: 120px;
            border: 2px solid #333;
            padding: 15px;
            color: white;
        }
        .cell-one {
            background-color: red;
            opacity: 30%;
        }
        .cell-two {
            background-color: purple;
            opacity: 30%;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="cell-one">Hello</td>
            <td class="cell-two">World</td>
        </tr>
    </table>
</body>
</html>
