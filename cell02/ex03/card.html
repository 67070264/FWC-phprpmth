<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <h1>User Profile Card</h1>

    <div class="card">
        <table class="card-table">
            <tr>
                <td class="img-cell">
                    <img src="https://i.pinimg.com/736x/b7/62/93/b76293fe3a98b2d5a963f101c269b305.jpg">
                </td>
            </tr>
            <tr>
                <td class="login-name">phprpmth</td>
            </tr>
            <tr>
                <td class="description">Level 67, The Skibidi</td>
            </tr>
            <tr>
                <td class="campus">42Bangkok</td>
            </tr>
            <tr>
                <td class="social-links">
                    <img src="https://cdn-icons-png.flaticon.com/128/1006/1006771.png" alt="web">
                    <img src="https://cdn-icons-png.flaticon.com/128/733/733579.png" alt="twitter">
                    <img src="https://cdn-icons-png.flaticon.com/128/3536/3536505.png" alt="linkedin">
                    <img src="https://cdn-icons-png.flaticon.com/128/733/733547.png" alt="facebook">
                </td>
            </tr>
            <tr>
                <td class="btn-cell">
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
